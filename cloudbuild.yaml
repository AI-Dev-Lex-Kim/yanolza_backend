steps:
  - name: gcr.io/cloud-builders/gcloud
    entrypoint: bash
    args:
      - -ceu
      - |
        gcloud compute ssh yanolja-backend \
          --project=yanolja-alert \
          --zone=us-west1-a \
          --tunnel-through-iap \
          --strict-host-key-checking=no \
          --command='sudo -u deploy -H bash -lc "cd /opt/yanolja_backend && git pull --ff-only origin main && docker compose up -d --build && docker image prune -f && docker compose ps"'

options:
  logging: CLOUD_LOGGING_ONLY
