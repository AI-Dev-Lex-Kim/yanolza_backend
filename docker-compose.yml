services:
  backend:
    build: .
    restart: unless-stopped
    environment:
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-https://yanolza-frontend.netlify.app}
      GCP_PROJECT_ID: ${GCP_PROJECT_ID:-yanolja-alert}
      NTFY_TOPIC_SECRET: ${NTFY_TOPIC_SECRET:-yanolja-ntfy-topic}
      URL_ALLOWLIST_ENABLED: ${URL_ALLOWLIST_ENABLED:-1}
    volumes:
      - backend-data:/app/data

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      BACKEND_HOST: ${BACKEND_HOST:-35.212.226.217.sslip.io}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  backend-data:
  caddy-data:
  caddy-config:
